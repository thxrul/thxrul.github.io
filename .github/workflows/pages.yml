name: Refresh audio library
on:
  push:
    branches: [main]
    paths:
      - 'audio/**'
      - 'scripts/build_audio_library.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: audio-library
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio metadata reader
        run: python -m pip install mutagen==1.47.0
      - name: Read audio metadata and embedded artwork
        run: python scripts/build_audio_library.py
      - name: Save generated metadata
        run: |
          git add audio/library.json
          if [ -d audio/artwork ]; then git add audio/artwork; fi
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh audio metadata and artwork'
            git push origin HEAD:main
          fi
      - name: Publish refreshed audio library
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
